<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbacoa Contreras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eca792 0%, #C9826E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #FFF9F2;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(61, 54, 50, 0.24);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #3D3632;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .menu-item {
            background: #FBF5EF;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #C9826E;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: 600;
            color: #3D3632;
            font-size: 16px;
        }

        .item-price {
            color: #C9826E;
            font-weight: bold;
            font-size: 16px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            color: #6F655F;
            font-size: 14px;
            min-width: 80px;
        }

        input[type="number"],
        select {
            padding: 8px 10px;
            background: #FFF9F2;
            border: 1px solid #E7D9CC;
            border-radius: 5px;
            color: #3D3632;
            font-size: 14px;
            width: 100px;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #C9826E;
            box-shadow: 0 0 5px rgba(201, 130, 110, 0.3);
        }

        .kilo-options {
            margin-top: 10px;
        }

        .kilo-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            color: #6F655F;
        }

        .calculation-result {
            color: #C9826E;
            font-size: 13px;
            font-weight: 600;
            min-width: 80px;
            text-align: right;
        }

        input[type="radio"] {
            accent-color: #C9826E;
            cursor: pointer;
        }

        .checkbox-item {
            background: #FBF5EF;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #D9B77E;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="checkbox"] {
            accent-color: #C9826E;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .checkbox-label {
            font-weight: 600;
            color: #3D3632;
            flex: 1;
        }

        .separator {
            height: 2px;
            background: linear-gradient(to right, #D9B77E, transparent);
            margin: 25px 0;
        }

        .totales {
            background: linear-gradient(135deg, #ecbaab 0%, #C9826E 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .total-row.final {
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .total-label {
            opacity: 0.95;
        }

        .total-amount {
            font-weight: 600;
        }

        .card-total {
            text-align: right;
            font-size: 13px;
            font-weight: 300;
            opacity: 0.7;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-calcular {
            background: linear-gradient(135deg, #ecbaab 0%, #C9826E 100%);
            color: white;
        }

        .btn-calcular:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(155, 101, 85, 0.34);
        }

        .btn-limpiar {
            background: #E7D9CC;
            color: #3D3632;
        }

        .btn-limpiar:hover {
            background: #D9B77E;
        }

        .floating-summary {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            width: 150px;
            padding: 30px 16px 16px;
            background: #FFF9F2;
            border: 1px solid #E7D9CC;
            border-left: 4px solid #C9826E;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(61, 54, 50, 0.18);
        }

        .floating-summary-close {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: #9B6555;
            font-size: 24px;
            line-height: 1;
            box-shadow: none;
        }

        .floating-summary-close:hover {
            transform: none;
            background: #FBF5EF;
            box-shadow: none;
        }

        .floating-summary-amounts {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            color: #3D3632;
        }

        .floating-summary-cash {
            font-size: 22px;
            font-weight: 700;
        }

        .floating-summary-card {
            color: #6F655F;
            font-size: 17px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="floating-summary hidden" id="floatingSummary">
        <button class="floating-summary-close" type="button" id="floatingSummaryClose" aria-label="Cerrar resumen">&times;</button>
        <div class="floating-summary-amounts">
            <div class="floating-summary-cash" id="floatingTotal">$0.00</div>
            <div class="floating-summary-card" id="floatingTotalTarjeta">$0</div>
        </div>
    </div>

    <div class="container">
        <h1>Calculadora de cuenta</h1>

        <!-- Tacos -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Tacos</span>
            </div>
            <div class="input-group">
                <!--label for="tacos">Cantidad:</label -->
                <input type="number" id="tacos" min="0" step="1">
            </div>
        </div>

        <!-- Consomés -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Consomés</span>
            </div>
            <div class="kilo-options">
                <label>
                    <input type="number" id="consomeChico" min="0" step="1">
                    Normal - $30
                </label>
                <label>
                    <input type="number" id="consomeMedio" min="0" step="1">
                    Medio - $20
                </label>
                <label>
                    <input type="number" id="consomeLitro" min="0" step="1">
                    Litro - $60
                </label>
            </div>
        </div>

        <!-- Tortillas -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Tortillas</span>
            </div>
            <div class="kilo-options">
                <label>
                    <input type="number" id="tortillaKilo" min="0" step="1">
                    Kilo - $25
                </label>
                <label>
                    <input type="number" id="tortillaMedio" min="0" step="1">
                    Medio - $13
                </label>
                <label>
                    <input type="number" id="tortillaPesos" min="0" step="1">
                    Pesos
                </label>
            </div>
        </div>

        <!-- Pata -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Pata</span>
            </div>
            <div class="input-group">
               
                <input type="number" id="pata" min="0" step="1">
            </div>
        </div>

        <!-- Refresco -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Refresco</span>
            </div>
            <div class="input-group">
                
                <input type="number" id="refresco" min="0" step="1">
            </div>
        </div>

        <!-- Pulque -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Pulque</span>
            </div>
            <div class="kilo-options">
                <label>
                    <input type="number" id="pulqueMedio" min="0" step="1">
                    Medios - $25
                </label>
                <label>
                    <input type="number" id="pulqueLitro" min="0" step="1">
                    Litros - $45
                </label>
            </div>
        </div>

        <!-- Pesado -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Pesado</span>
            </div>
            <div class="kilo-options">
                <label>
                    <input type="radio" name="pesadoKilo" value="0" checked> N/A
                </label>
                <label>
                    <input type="radio" name="pesadoKilo" value="0.25"> 1/4 Kg - $170
                </label>
                <label>
                    <input type="radio" name="pesadoKilo" value="0.5"> 1/2 Kg - $340
                </label>
                <label>
                    <input type="radio" name="pesadoKilo" value="0.75"> 3/4 Kg - $510
                </label>
                <label>
                    <input type="radio" name="pesadoKilo" value="1"> 1 Kg - $680
                </label>
                <label>
                    <input type="number" id="pesadoMonto" min="0" step="1">
                    Pesos
                    <span class="calculation-result" id="pesadoGramosResultado">0 g</span>
                </label>
                <label>
                    <input type="number" id="pesadoGramos" min="0" step="1">
                    Gramos
                    <span class="calculation-result" id="pesadoMontoResultado">$0.00</span>
                </label>
            </div>
        </div>

        <!-- Cantidad extra -->
        <div class="menu-item">
            <div class="item-header">
                <span class="item-name">Cantidad extra</span>
            </div>
            <div class="input-group">
                <input type="number" id="cantidadExtra" min="0" step="1">
            </div>
        </div>

        <!-- Para llevar -->
        <div class="checkbox-item">
            <input type="checkbox" id="paraLlevar">
            <label for="paraLlevar" class="checkbox-label">Para Llevar (+$5)</label>
        </div>

        <div class="separator"></div>

        <!-- Resumen -->
        <div class="totales">
            <div class="total-row final">
                <span class="total-label">TOTAL:</span>
                <span class="total-amount" id="total">$0.00</span>
            </div>
            <div class="card-total" id="totalTarjeta">0</div>
        </div>

        <!-- Botones -->
        <div class="buttons">
            <button class="btn-calcular" onclick="calcularCuenta()">Calcular Cuenta</button>
            <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
        </div>
    </div>

    <script>
        function obtenerNumero(id) {
            const valor = parseFloat(document.getElementById(id).value);
            return Number.isFinite(valor) ? valor : 0;
        }

        function obtenerEntero(id) {
            const valor = parseInt(document.getElementById(id).value, 10);
            return Number.isFinite(valor) ? valor : 0;
        }

        function mostrarResumenFlotante() {
            document.getElementById('floatingSummary').classList.remove('hidden');
        }

        function ocultarResumenFlotante() {
            document.getElementById('floatingSummary').classList.add('hidden');
        }

        function actualizarResumenFlotante(total, totalTarjeta) {
            document.getElementById('floatingTotal').textContent = formatearMoneda(total);
            document.getElementById('floatingTotalTarjeta').textContent = '$' + totalTarjeta;
        }

        function calcularCuenta() {
            // Obtener valores
            const tacos = obtenerEntero('tacos');
            const pata = obtenerEntero('pata');
            const refresco = obtenerEntero('refresco');
            const pulqueMedio = obtenerEntero('pulqueMedio');
            const pulqueLitro = obtenerEntero('pulqueLitro');
            const consomeChico = obtenerEntero('consomeChico');
            const consomeMedio = obtenerEntero('consomeMedio');
            const consomeLitro = obtenerEntero('consomeLitro');
            const tortillaKilo = obtenerEntero('tortillaKilo');
            const tortillaMedio = obtenerEntero('tortillaMedio');
            const tortillaPesos = obtenerNumero('tortillaPesos');
            const pesadoMonto = obtenerNumero('pesadoMonto');
            const pesadoGramos = obtenerNumero('pesadoGramos');
            const cantidadExtra = obtenerNumero('cantidadExtra');
            const pesadoKilo = parseFloat(document.querySelector('input[name="pesadoKilo"]:checked').value);
            const paraLlevar = document.getElementById('paraLlevar').checked;

            // Calcular precios
            const precio30 = 30;
            const precioKiloBase = 680;

            let totalTacos = tacos * precio30;
            let totalConsome = (consomeChico * 30) + (consomeMedio * 25) + (consomeLitro * 60);
            let totalTortillas = (tortillaKilo * 25) + (tortillaMedio * 13) + tortillaPesos;
            let totalPata = pata * precio30;
            let totalRefresco = refresco * precio30;
            let totalPulque = (pulqueMedio * 25) + (pulqueLitro * 45);
            let gramosPorMonto = (pesadoMonto / precioKiloBase) * 1000;
            let totalPesadoGramos = (pesadoGramos / 1000) * precioKiloBase;
            let totalPesadoKilo = pesadoKilo * precioKiloBase;
            let totalPesado = totalPesadoKilo + pesadoMonto + totalPesadoGramos;

            // Subtotal
            let subtotal = totalTacos + totalConsome + totalTortillas + totalPata + totalRefresco + totalPulque + totalPesado + cantidadExtra;

            // Para llevar
            let costoPaLlevar = 0;
            if (paraLlevar && subtotal > 0) {
                costoPaLlevar = 5;
            }

            // Total
            let total = subtotal + costoPaLlevar;
            let totalTarjeta = Math.ceil(total * 1.03);

            // Mostrar resultados
            document.getElementById('pesadoGramosResultado').textContent = Math.ceil(gramosPorMonto) + ' g';
            document.getElementById('pesadoMontoResultado').textContent = formatearMoneda(totalPesadoGramos);
            document.getElementById('total').textContent = formatearMoneda(total);
            document.getElementById('totalTarjeta').textContent = totalTarjeta;
            actualizarResumenFlotante(total, totalTarjeta);
            mostrarResumenFlotante();
        }

        function formatearMoneda(cantidad) {
            return '$' + cantidad.toLocaleString('es-MX', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function limpiar() {
            document.getElementById('tacos').value = '';
            document.getElementById('pata').value = '';
            document.getElementById('refresco').value = '';
            document.getElementById('pulqueMedio').value = '';
            document.getElementById('pulqueLitro').value = '';
            document.getElementById('consomeChico').value = '';
            document.getElementById('consomeMedio').value = '';
            document.getElementById('consomeLitro').value = '';
            document.getElementById('tortillaKilo').value = '';
            document.getElementById('tortillaMedio').value = '';
            document.getElementById('tortillaPesos').value = '';
            document.querySelector('input[name="pesadoKilo"][value="0"]').checked = true;
            document.getElementById('pesadoMonto').value = '';
            document.getElementById('pesadoGramos').value = '';
            document.getElementById('cantidadExtra').value = '';
            document.getElementById('pesadoGramosResultado').textContent = '0 g';
            document.getElementById('pesadoMontoResultado').textContent = '$0.00';
            document.getElementById('paraLlevar').checked = false;
            document.getElementById('total').textContent = '$0.00';
            document.getElementById('totalTarjeta').textContent = '0';
            actualizarResumenFlotante(0, 0);
        }

        document.getElementById('floatingSummaryClose').addEventListener('click', function() {
            limpiar();
            ocultarResumenFlotante();
        });

        // Calcular automáticamente cuando cambien los valores
        document.getElementById('tacos').addEventListener('input', calcularCuenta);
        document.getElementById('pata').addEventListener('input', calcularCuenta);
        document.getElementById('refresco').addEventListener('input', calcularCuenta);
        document.getElementById('tacos').addEventListener('change', calcularCuenta);
        document.getElementById('pata').addEventListener('change', calcularCuenta);
        document.getElementById('refresco').addEventListener('change', calcularCuenta);
        document.getElementById('pulqueMedio').addEventListener('input', calcularCuenta);
        document.getElementById('pulqueLitro').addEventListener('input', calcularCuenta);
        document.getElementById('consomeChico').addEventListener('input', calcularCuenta);
        document.getElementById('consomeMedio').addEventListener('input', calcularCuenta);
        document.getElementById('consomeLitro').addEventListener('input', calcularCuenta);
        document.getElementById('tortillaKilo').addEventListener('input', calcularCuenta);
        document.getElementById('tortillaMedio').addEventListener('input', calcularCuenta);
        document.getElementById('tortillaPesos').addEventListener('input', calcularCuenta);
        document.querySelectorAll('input[name="pesadoKilo"]').forEach(radio => {
            radio.addEventListener('change', calcularCuenta);
        });
        document.getElementById('pesadoMonto').addEventListener('input', calcularCuenta);
        document.getElementById('pesadoGramos').addEventListener('input', calcularCuenta);
        document.getElementById('cantidadExtra').addEventListener('input', calcularCuenta);
        document.getElementById('paraLlevar').addEventListener('change', calcularCuenta);
    </script>
</body>
</html>
